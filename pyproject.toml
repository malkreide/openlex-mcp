[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "openlex-mcp"
version     = "0.2.5"
description = "MCP Server for Canton Zurich legislation (ZH-Lex) — full-text search, article extraction, and education law tools"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.11"

keywords = [
    "mcp", "model-context-protocol", "swiss-open-data",
    "zurich-law", "zh-lex", "gesetzessammlung",
    "volksschulgesetz", "bildungsrecht",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Upper bound added deliberately: `mcp` 2.0.0 removed `mcp.server.fastmcp`
    # outright (the API moved to `mcp.server.mcpserver`), so an unbounded
    # `>=1.28.1` breaks every fresh install — CI and `pip install` alike.
    # Migrating to the 2.x API is real work and a decision to take on purpose,
    # not one a resolver should make silently.
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0,<27",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    # Exakt gepinnt, und zwar hier: Ein Lint- und Format-Gate ist nur dann eine
    # Zusicherung, wenn lokal dieselbe Version läuft wie in der CI. Vorher stand
    # der Pin allein in `ci.yml`, während diese Zeile `>=0.4.0` sagte — ein
    # frisches `pip install -e ".[dev]"` zog damit die jeweils neuste ruff, und
    # die meldete Abweichungen, die niemand verursacht hatte. Ein Bump gehört in
    # einen eigenen Commit, zusammen mit den Formatierungen, die er auslöst.
    "ruff==0.16.1",
]

[project.scripts]
openlex-mcp = "openlex_mcp.server:main"

[project.urls]
Homepage   = "https://github.com/malkreide/openlex-mcp"
Repository = "https://github.com/malkreide/openlex-mcp"
Issues     = "https://github.com/malkreide/openlex-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openlex_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"
markers      = [
    "live: live API tests (skipped in CI by default)",
]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
