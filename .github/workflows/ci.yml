name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # `issues: read` braucht der Dependabot-Label-Check unten — die Label-API
    # haengt an diesem Scope. `contents: read` ist der Checkout. Mehr braucht
    # dieser Job nicht, und ohne Block erbte er die Repo-Vorgabe.
    permissions:
      contents: read
      issues: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      # ruff is pinned in pyproject.toml's [dev] extra, so the version installed
      # above is the one that runs here — and the same one a contributor gets
      # locally. Do not re-add a `pip install ruff==...` step: a second
      # declaration is what let the local and CI versions drift apart before.
      # `tests/test_toolchain_pin.py` fails if one reappears.
      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

      # Dependabot legt ein Label nicht an, das in dependabot.yml steht und im
      # Repo fehlt — es kommentiert nur an jedem PR. Das faellt sonst nirgends
      # auf. Der Token ist der Standard-GITHUB_TOKEN; ohne ihn faellt der Check
      # hier absichtlich, statt still zu ueberspringen.
      - name: Dependabot-Labels (Deklaration ↔ Repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_dependabot_labels.py
